name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CTEST_PARALLEL_LEVEL: 4
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Core and platform gates
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  windows-msvc-stage:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure
        run: >-
          cmake --preset windows-msvc
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build --preset windows-msvc
      - name: Full Windows test suite
        run: ctest --preset windows-msvc
        env:
          SSG_WINDOWS_WATCHER_TRACE: 1
      - name: Install
        run: >-
          cmake --install build-windows
          --config Release
          --prefix build-windows/package
      - name: Verify packaged runtime dependencies
        shell: pwsh
        run: |
          $package = Resolve-Path "build-windows/package"
          $executable = Join-Path $package "bin/ssg.exe"
          $dependencies = dumpbin /dependents $executable |
            Select-String '^\s+(MSVCP|VCRUNTIME|CONCRT).*\.dll\s*$' |
            ForEach-Object { $_.Matches.Value.Trim() }
          foreach ($dependency in $dependencies) {
            if (-not (Test-Path (Join-Path $package "bin/$dependency"))) {
              throw "Missing packaged MSVC runtime dependency: $dependency"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ssg-windows-x64-${{ github.sha }}
          path: build-windows/package
          if-no-files-found: error
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  sanitizer:
    runs-on: ubuntu-latest
    env:
      CTEST_PARALLEL_LEVEL: 4
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DSSG_SANITIZE=ON
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build build-sanitize --parallel 2
      - name: Sanitizer gates
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
