name: ci

on:
  push:
  pull_request:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Platform interface compile and link
        run: cmake --build build --config Release --target ssg_tests
      - name: Core and platform gates
        run: ctest --test-dir build -C Release --output-on-failure

  windows-msvc-stage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc
      - name: Platform interface gate
        run: ctest --preset windows-msvc -R "^test_platform_interface$"
      - name: Windows watcher gates
        run: ctest --preset windows-msvc -R "^ssg_watcher_tests$"
      - name: Full Windows test suite
        run: ctest --preset windows-msvc

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DSSG_SANITIZE=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Sanitizer gates
        run: ctest --test-dir build-sanitize --output-on-failure
