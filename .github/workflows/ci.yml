name: ci

on:
  push:
  pull_request:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Platform interface compile and link
        run: cmake --build build --config Release --target ssg_tests
      - name: Core and platform gates
        run: ctest --test-dir build -C Release --output-on-failure

  windows-msvc-stage:
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build staged Windows tests
        run: cmake --build --preset windows-msvc
      - name: Run staged Windows platform tests
        run: ctest --test-dir build-windows -C Release --output-on-failure -R "test_platform_runtime|test_windows_platform_runtime|test_windows_console_input|ssg_watcher_tests"

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DSSG_SANITIZE=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Sanitizer gates
        run: ctest --test-dir build-sanitize --output-on-failure
